# Eval cases against corpus.yml. Answerable questions are natural language so a
# real-key run measures *semantic* retrieval; each names its gold source by
# expected_markers (verbatim substrings of the correct chunk; matched on content,
# not chunk id — ADR 0005). Several have a topical distractor in the corpus so
# MRR can drop below 1.0 when ranking degrades.
#
# The out-of-corpus cases are mostly *near-misses*: on-topic Helios questions the
# corpus does not actually answer. These pressure the relevance floor — if it is
# too low, a tangential chunk clears it and the system answers (fabricates)
# instead of abstaining, dropping abstention accuracy. That is the meaningful
# failure this set can now surface.

# --- Retrieval discrimination (distractor present) -------------------------
- id: telemetry-interval
  question: "How often does each site send panel telemetry to Helios?"
  expected_markers:
    - "every 30 seconds"
  reference_answer: "Every 30 seconds."

- id: battery-interval
  question: "How often does a battery report its state of charge?"
  expected_markers:
    - "every 5 minutes"
  reference_answer: "Every 5 minutes."

- id: free-tier-retention
  question: "How long does the free tier keep telemetry data?"
  expected_markers:
    - "90 days"
  reference_answer: "90 days."

- id: paid-tier-retention
  question: "How long do paid tiers retain telemetry data?"
  expected_markers:
    - "5 years"
  reference_answer: "5 years."

- id: low-output-alert
  question: "When does Helios send a low-output alert?"
  expected_markers:
    - "below 70 percent"
    - "15 minutes"
  reference_answer: "When a panel's output drops below 70 percent of expected for more than 15 minutes."

- id: api-rate-limit
  question: "What is the rate limit on the Helios REST API?"
  expected_markers:
    - "100 requests per minute"
  reference_answer: "100 requests per minute per account."

- id: webhook-retries
  question: "How many times does Helios retry a failed webhook?"
  expected_markers:
    - "5 times"
  reference_answer: "Up to 5 times."

# --- Lexically-hard: a rare identifier buried in a long section --------------
# Each question hinges on one identifier (E-7700, SB-3300, HX-9400) that lives
# once inside a long ops-manual chunk. Dense dilutes the long chunk and ranks a
# shorter on-topic decoy first; the hybrid lexical leg matches the exact lexeme
# and recovers the buried record. Markers are the identifiers themselves (unique
# to the gold chunk), so MRR drops precisely when a decoy wins. This subset is
# where the hybrid recall/MRR lift shows (ADR 0007, README table).
- id: diag-e7700
  question: "What condition does diagnostic reference E-7700 indicate?"
  expected_markers:
    - "E-7700"
  reference_answer: "It is written when a battery pack crosses its safe operating envelope, halting charging (a thermal/over-envelope cutoff)."

- id: bulletin-sb3300
  question: "What change does service bulletin SB-3300 document?"
  expected_markers:
    - "SB-3300"
  reference_answer: "A revised webhook retry schedule and a stricter clock-drift tolerance on gateway authentication."

- id: part-hx9400
  question: "Which gateway model carries part number HX-9400?"
  expected_markers:
    - "HX-9400"
  reference_answer: "The largest, highest-capacity gateway, specified for installations spanning two arrays."

# --- Abstention: near-miss (on-topic, unanswerable) + one obvious control ---
- id: oc-powerwall
  question: "Does Helios integrate with the Tesla Powerwall?"
  out_of_corpus: true

- id: oc-uptime-sla
  question: "What uptime SLA does Helios guarantee?"
  out_of_corpus: true

- id: oc-capital-france
  question: "What is the capital of France?"
  out_of_corpus: true
